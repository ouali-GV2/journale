<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journal de trades</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12202a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#12202a}
  iframe{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);
    width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#fff}
  #bk-fab{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;width:40px;height:40px;border-radius:50%;
    border:0;background:#12202a;color:#fff;font-size:18px;opacity:.75;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  #bk-panel{position:fixed;left:10px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:11;display:none;width:min(290px,calc(100% - 20px));
    background:#12202a;color:#e8eef2;border-radius:14px;padding:14px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #bk-panel.on{display:block}
  #bk-panel button{display:block;width:100%;margin:8px 0 0;padding:11px;border:0;border-radius:10px;font-size:14px;background:#3fcf9d;color:#06231a;font-weight:600}
  #bk-panel button.sec{background:#243845;color:#e8eef2;font-weight:500}
  #bk-msg{margin-top:10px;font-size:12px;color:#9fb3c0;min-height:16px}
  #bk-bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:12;display:none;background:#f5b942;color:#2a1c00;
    font:13px/1.3 system-ui,sans-serif;padding:8px 10px;align-items:center;gap:8px}
  #bk-bar.on{display:flex}
  #bk-bar span{flex:1}
  #bk-bar button{border:0;border-radius:8px;padding:7px 10px;font-size:13px;background:#12202a;color:#fff}
  #lk{position:fixed;inset:0;z-index:50;background:#12202a;display:flex;align-items:center;justify-content:center;padding:20px;
    font:15px/1.4 system-ui,sans-serif;color:#e8eef2}
  #lk.off{display:none}
  #lk form{width:min(340px,100%);text-align:center}
  #lk img{width:72px;height:72px;border-radius:16px}
  #lk h1{font-size:20px;margin:12px 0 4px}
  #lk p{margin:0 0 16px;color:#9fb3c0;font-size:13px}
  #lk input[type=password]{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #2f4757;background:#0c161d;color:#fff;font-size:16px}
  #lk label{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0;font-size:13px;color:#c5d3dc}
  #lk button{width:100%;padding:13px;border:0;border-radius:10px;background:#3fcf9d;color:#06231a;font-size:15px;font-weight:700}
  #lk button:disabled{opacity:.6}
  #lk-err{min-height:18px;margin-top:12px;font-size:13px;color:#ff8a80}
  body.locked #bk-fab,body.locked #bk-bar,body.locked #bk-panel{display:none!important}
</style>
</head>
<body>
<div id="lk"><form id="lk-f" autocomplete="off">
  <img src="icons/icon-192.png" alt="">
  <h1>Journal de trades IBKR</h1><p>Entre ton mot de passe pour ouvrir le journal.</p>
  <input type="password" id="lk-pw" placeholder="Mot de passe" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="lk-keep"> Rester déverrouillé sur cet appareil</label>
  <button type="submit" id="lk-go">Ouvrir</button>
  <div id="lk-err"></div>
</form></div>
<iframe title="Journal de trades" id="jf"></iframe>
<div id="bk-bar"><span id="bk-bar-t">Pense à sauvegarder ton journal.</span><button id="bk-bar-go">Sauvegarder</button><button id="bk-bar-x" aria-label="Plus tard">✕</button></div>
<button id="bk-fab" aria-label="Sauvegarde">💾</button>
<div id="bk-panel">
  <div><b>Sauvegarde du journal</b></div>
  <div id="bk-last" style="font-size:12px;color:#9fb3c0;margin-top:2px"></div>
  <button id="bk-share">Sauvegarder maintenant (Drive, Gmail…)</button>
  <button id="bk-dl" class="sec">Télécharger le fichier</button>
  <button id="bk-rs" class="sec">Restaurer depuis un fichier</button>
  <button id="bk-remind" class="sec">🔔 Activer le rappel quotidien</button>
  <button id="bk-lock" class="sec">🔒 Verrouiller</button>
  <button id="bk-close" class="sec">Fermer</button>
  <div id="bk-msg"></div>
  <input type="file" id="bk-file" accept=".json,application/json" hidden>
</div>
<script>
(function(){
  var LS=window.localStorage, K_LAST='app_lastBackup', K_SNZ='app_snooze', K_INST='app_installed', WEEK=7*864e5;
  function g(k){try{return LS.getItem(k)}catch(e){return null}}
  function st(k,v){try{LS.setItem(k,v)}catch(e){}}
  var $=function(i){return document.getElementById(i)};
  if(!g(K_INST)) st(K_INST,String(Date.now()));
  function collect(){
    var d={};
    try{for(var i=0;i<LS.length;i++){var k=LS.key(i);if(k&&k.indexOf('jt_')===0)d[k]=LS.getItem(k);}}catch(e){}
    return d;
  }
  function msg(t){$('bk-msg').textContent=t||''}
  function fname(){var n=new Date(),p=function(x){return String(x).padStart(2,'0')};
    return 'journal-sauvegarde-'+n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'.json'}
  function build(){
    var d=collect();
    if(!Object.keys(d).length){msg('Aucune donnée à sauvegarder pour le moment.');return null}
    var blob=new Blob([JSON.stringify({app:'journal-ibkr',version:1,date:new Date().toISOString(),data:d})],{type:'application/json'});
    return new File([blob],fname(),{type:'application/json'});
  }
  function mark(){st(K_LAST,String(Date.now()));refresh()}
  function download(f){
    var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }
  function doShare(){
    var f=build();if(!f)return;
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'Sauvegarde journal'}).then(function(){mark();msg('Sauvegarde envoyée ✔')})
        .catch(function(e){if(e&&e.name!=='AbortError'){download(f);mark();msg('Partage indisponible : fichier téléchargé.')}});
    }else{download(f);mark();msg('Fichier téléchargé. Envoie-le ensuite vers Drive.')}
  }
  function doDl(){var f=build();if(!f)return;download(f);mark();msg('Fichier téléchargé ✔')}
  function doRestore(file){
    var r=new FileReader();
    r.onload=function(){
      var o;try{o=JSON.parse(r.result)}catch(e){msg('Fichier illisible.');return}
      if(!o||o.app!=='journal-ibkr'||!o.data||typeof o.data!=='object'){msg('Ce fichier n\u2019est pas une sauvegarde de cette application.');return}
      var n=Object.keys(o.data).length;
      if(!confirm('Restaurer '+n+' élément(s) ? Les données actuelles du journal seront remplacées.'))return;
      try{
        var del=[];for(var i=0;i<LS.length;i++){var k=LS.key(i);if(k&&k.indexOf('jt_')===0)del.push(k)}
        del.forEach(function(k){LS.removeItem(k)});
        Object.keys(o.data).forEach(function(k){var kk=k.replace(/^j[td]_/,'jt_');if(typeof o.data[k]==='string')LS.setItem(kk,o.data[k])});
      }catch(e){msg('Erreur de restauration.');return}
      msg('Restauré ✔ Rechargement…');
      setTimeout(function(){$('jf').contentWindow.location.reload()},400);
    };
    r.readAsText(file);
  }
  function refresh(){
    var l=parseInt(g(K_LAST)||'0',10);
    $('bk-last').textContent=l?('Dernière sauvegarde : '+new Date(l).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})):'Aucune sauvegarde effectuée.';
    var ref=l||parseInt(g(K_INST)||'0',10), snz=parseInt(g(K_SNZ)||'0',10), now=Date.now();
    var due=(now-ref>WEEK)&&(now-snz>864e5)&&Object.keys(collect()).length>0;
    $('bk-bar').classList.toggle('on',due);
    $('bk-bar-t').textContent=l?'Dernière sauvegarde il y a plus d’une semaine.':'Tu n’as encore jamais sauvegardé ton journal.';
  }
  $('bk-fab').onclick=function(){$('bk-panel').classList.toggle('on');msg('');refresh()};
  $('bk-lock').onclick=function(){window.__lockNow&&window.__lockNow()};
  $('bk-close').onclick=function(){$('bk-panel').classList.remove('on')};
  $('bk-share').onclick=doShare;$('bk-dl').onclick=doDl;
  $('bk-rs').onclick=function(){$('bk-file').click()};
  $('bk-file').onchange=function(e){var f=e.target.files&&e.target.files[0];if(f)doRestore(f);e.target.value=''};
  $('bk-bar-go').onclick=function(){$('bk-bar').classList.remove('on');$('bk-panel').classList.add('on');doShare()};
  $('bk-bar-x').onclick=function(){st(K_SNZ,String(Date.now()));refresh()};
  window.__bkRefresh=refresh;
  refresh();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)}, jf=$('jf');
  var params=new URLSearchParams(location.search), ACT=params.get('action'), SHARE=params.get('share');
  function clean(){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  function handleShare(w){
    caches.open('jshare').then(function(c){return c.match('shared-file').then(function(r){
      if(!r)return; return r.blob().then(function(b){
        var f=new File([b],r.headers.get('x-name')||'releve.csv');
        if(confirm('Importer ce relevé et le fusionner avec tes données ?')){w.__importFile(f,true);setTimeout(function(){alert('Relevé importé. Vérifie le résultat dans l’onglet Données.')},600)}
        return c.delete('shared-file');
      })})}).catch(function(){});
  }
  window.__afterUnlock=function(){
    if(!ACT&&!SHARE)return; var n=0;
    (function wait(){
      var w=jf.contentWindow;
      if(w&&w.__journalReady){
        if(ACT==='new')w.__openQuick();
        if(ACT==='backup'){$('bk-panel').classList.add('on')}
        if(SHARE)handleShare(w);
        ACT=SHARE=null;clean();
      }else if(n++<60)setTimeout(wait,200);
    })();
  };
  var rb=$('bk-remind');
  function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function label(){rb.textContent=(g('app_remind')==='1'?'🔔 Rappel quotidien : activé':'🔔 Activer le rappel quotidien')}
  function say(t){$('bk-msg').textContent=t}
  if(rb){label();rb.onclick=async function(){
    try{
      var reg=await navigator.serviceWorker.ready;
      if(g('app_remind')==='1'){await reg.periodicSync.unregister('journal-remind');st('app_remind','0');label();say('Rappel désactivé.');return}
      if(!('periodicSync' in reg)||!('Notification' in window)){say('Rappel non pris en charge sur ce téléphone.');return}
      var perm=await Notification.requestPermission(); if(perm!=='granted'){say('Notifications refusées dans Chrome.');return}
      await reg.periodicSync.register('journal-remind',{minInterval:12*36e5});
      st('app_remind','1');label();say('Rappel activé. Android choisit l’heure exacte (en fin de journée, pas toujours précis).');
    }catch(e){say('Rappel indisponible ici.')}
  }}
})();
</script>
<script>
(function(){
  var APP='principal', DB='jlock-'+APP, ST='k';
  var $=function(i){return document.getElementById(i)}, jf=$('jf'), enc=null;
  document.body.classList.add('locked');
  function idb(){return new Promise(function(res,rej){var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(){r.result.createObjectStore(ST)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function idbGet(){return idb().then(function(d){return new Promise(function(res){var q=d.transaction(ST).objectStore(ST).get('key');q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
  function idbSet(v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction(ST,'readwrite');t.objectStore(ST).put(v,'key');t.oncomplete=res;t.onerror=rej})})}
  function idbDel(){return idb().then(function(d){return new Promise(function(res){var t=d.transaction(ST,'readwrite');t.objectStore(ST).delete('key');t.oncomplete=res;t.onerror=res})}).catch(function(){})}
  function parts(buf){var u=new Uint8Array(buf),m='JENC1';
    for(var i=0;i<5;i++)if(u[i]!==m.charCodeAt(i))return null;
    return {salt:u.slice(5,21),iv:u.slice(21,33),ct:u.slice(33)}}
  function same(a,b){if(!a||!b||a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
  function derive(pw,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})}
  function decrypt(key,p){return crypto.subtle.decrypt({name:'AES-GCM',iv:p.iv},key,p.ct).then(function(b){return new TextDecoder().decode(b)})}
  function show(html){
    jf.srcdoc=html;$('lk').classList.add('off');document.body.classList.remove('locked');
    if(window.__bkRefresh)window.__bkRefresh();
    if(window.__afterUnlock)window.__afterUnlock();
  }
  function err(t){$('lk-err').textContent=t||''}
  function load(){
    return fetch('journal.enc',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(b){enc=parts(b);if(!enc)throw 0});
  }
  load().then(function(){return idbGet()}).then(function(s){
    if(s&&s.key&&same(s.salt,enc.salt)){return decrypt(s.key,enc).then(show).catch(function(){return idbDel()})}
  }).catch(function(){err('Fichier journal.enc introuvable ou illisible.')});
  $('lk-f').onsubmit=function(e){
    e.preventDefault();var pw=$('lk-pw').value;if(!pw)return;
    if(!enc){err('Fichier journal.enc introuvable.');return}
    err('');$('lk-go').disabled=true;$('lk-go').textContent='Vérification…';
    derive(pw,enc.salt).then(function(key){return decrypt(key,enc).then(function(html){
      var keep=$('lk-keep').checked;
      return (keep?idbSet({salt:enc.salt,key:key}):idbDel()).catch(function(){}).then(function(){$('lk-pw').value='';show(html)});
    })}).catch(function(){err('Mot de passe incorrect.')})
      .then(function(){$('lk-go').disabled=false;$('lk-go').textContent='Ouvrir'});
  };
  window.__lockNow=function(){idbDel().then(function(){location.reload()})};
})();
</script>
</body>
</html>
